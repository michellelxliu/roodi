<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roodi</title>
<meta name="description" content="Roodi: request-aware ML inference.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23e8590c'/></svg>">
<style>
  :root { --bg: #fbfaf8; --text: #1c1b19; --muted: #5f5c55; --accent: #d9480f; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141312; --text: #f1eee9; --muted: #a8a399; --accent: #ff8a4c; }
  }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
    display: flex; align-items: center; justify-content: center;
    padding: 0 16px; box-sizing: border-box; text-align: center;
  }
  .mark { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); margin: 0 auto 20px; }
  h1 { font-size: clamp(40px, 8vw, 64px); letter-spacing: -0.04em; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); font-size: 19px; }
</style>
</head>
<body>
  <main>
    <div class="mark"></div>
    <h1>Roodi</h1>
    <p>Request-aware ML inference.</p>
  </main>
</body>
</html>
